# Chapter 31: fast tests gate everything; the risk tier a real PR's own
# diff lands in (chapter 28's own real policy, unchanged here, not
# reinvented for CI) decides which of the remaining tiers actually run.
# A LOW-risk change never pays for integration, contract, or eval
# containers it doesn't need; a HIGH-risk change can't merge without
# all five tiers, chapter 28's own REQUIRED_TEST_TIERS, having run.
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  fast-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest tests/unit tests/orchestration -v

  release-gate:
    runs-on: ubuntu-latest
    needs: fast-tests
    outputs:
      tier: ${{ steps.gate.outputs.tier }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      - id: gate
        run: |
          BASE="${{ github.event.pull_request.base.sha || 'HEAD~1' }}"
          uv run python scripts/check_release_gate.py "$BASE...HEAD" | tee gate_output.txt
          TIER=$(grep "^Risk tier:" gate_output.txt | awk '{print $3}')
          echo "tier=$TIER" >> "$GITHUB_OUTPUT"

  integration-tests:
    runs-on: ubuntu-latest
    needs: release-gate
    if: needs.release-gate.outputs.tier != 'LOW'
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: triage_app
          POSTGRES_PASSWORD: triage_app
          POSTGRES_DB: triage_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U triage_app"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://triage_app:triage_app@localhost:5432/triage_app
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      - run: uv run python scripts/migrate.py
      - run: uv run pytest tests/integration -v

  contract-and-evals:
    runs-on: ubuntu-latest
    needs: release-gate
    if: needs.release-gate.outputs.tier == 'HIGH'
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL_ID: gemini-3.6-flash
      AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
      AUTH0_AUDIENCE: ${{ secrets.AUTH0_AUDIENCE }}
      AUTH0_TEST_CLIENT_ID: ${{ secrets.AUTH0_TEST_CLIENT_ID }}
      AUTH0_TEST_CLIENT_SECRET: ${{ secrets.AUTH0_TEST_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
      - run: uv sync --locked
      - run: uv run pytest tests/contract tests/evals -v
